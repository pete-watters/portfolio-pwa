# Deploys to Cloudflare Pages.
#
# Branch strategy:
#   main → production (petewatters.ie)
#   dev  → stable staging at dev.portfolio.pages.dev
#   PR   → ephemeral per-PR preview at <branch>.portfolio.pages.dev
#
# Workflow: feature branches → PR into dev → merge dev → main when releasing.

name: Deploy

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HELIUS_KEY: ${{ secrets.HELIUS_KEY }}
      NFT_MINT: ${{ secrets.NFT_MINT }}
      # Reuses the existing GH_PAT secret for the Open Source contribution
      # section. Mapped to GITHUB_TOKEN because that name is reserved by Actions
      # and can't be used as a secret name directly. Needs read:user access.
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create Pages project if needed
        run: npx wrangler pages project create portfolio --production-branch main 2>/dev/null || true
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Ephemeral per-PR preview
            DEPLOY_OUTPUT=$(npx wrangler pages deploy dist --project-name=portfolio --branch="${{ github.head_ref }}" --commit-dirty=true 2>&1)
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            # Stable staging deploy: dev.portfolio.pages.dev
            DEPLOY_OUTPUT=$(npx wrangler pages deploy dist --project-name=portfolio --branch=dev --commit-dirty=true 2>&1)
          else
            # Production (main branch)
            DEPLOY_OUTPUT=$(npx wrangler pages deploy dist --project-name=portfolio --commit-dirty=true 2>&1)
          fi
          echo "$DEPLOY_OUTPUT"
          URL=$(echo "$DEPLOY_OUTPUT" | grep 'alias URL' | grep -oE 'https://[^ ]+')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `Preview deployment: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('Preview deployment:'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
