extends: existence
message: "AI-style opening. Consider a more direct start."
level: warning
ignorecase: true
# One alternation, not a list. Vale concatenates successive `raw` entries into
# a single expression rather than OR-ing them, so the previous six-entry list
# compiled to one pattern that could never match anything.
raw:
  - "^(In the (ever-evolving|fast-paced|rapidly changing) (world|landscape|realm)"
  - "|(Have you ever wondered|Imagine a world|Picture this)"
  - "|(As developers|As engineers|As programmers), we"
  - "|In today's"
  - "|When it comes to"
  - "|Whether you're a)"
